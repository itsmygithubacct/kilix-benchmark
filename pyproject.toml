[project]
name = "kilix-benchmark"
version = "0.1.0"
description = "Benchmark suites for local language models and Kilix desktops"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
kilix-benchmark = "kilix_benchmark.mcq:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilix_benchmark"]
